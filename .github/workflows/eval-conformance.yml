name: Eval software conformance

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CXLAB_CODE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Install locked development dependencies
        run: uv sync --frozen --group dev --extra openai
      - name: Unit, integration, and local CLI conformance tests
        run: |
          uv run --extra openai coverage run --branch --source=cx_eval_lab -m unittest discover -s tests
          uv run --extra openai coverage report --fail-under=80
          uv run --extra openai coverage xml -o coverage.xml
      - name: Exercise lab pass, insufficient-evidence hold, and policy block
        run: uv run python -m cx_eval_lab.ci_conformance --output-dir ci-evidence --code-revision "$CXLAB_CODE_REVISION"
      - name: Exercise campaign consistency and release-decision composition
        run: uv run python -m cx_eval_lab.campaign_conformance --output ci-evidence/campaign-conformance.json
      - name: Replay paired multi-order executions and reject unqualified release
        run: uv run python -m cx_eval_lab.resolution_paired_study --output ci-evidence/resolution-paired.json
      - name: Replay row-derived native semantic controls without deployment authority
        run: uv run python -m cx_eval_lab.resolution_semantic_study --output ci-evidence/resolution-semantic.json
      - name: Exercise native SDK transport and campaign accounting offline
        run: uv run --extra openai python -m cx_eval_lab.native_provider_study --output ci-evidence/native-provider.json
      - name: Recompute committed source and current qualification offline
        run: uv run --extra openai python -m cx_eval_lab.current_release_study --output ci-evidence/current-release.json
      - name: Execute retrieval, oracle, and full-context action controls
        run: uv run python -m cx_eval_lab.knowledge_action --output ci-evidence/knowledge-action.json
      - name: Exercise local process containment and false-stop controls
        run: uv run python -m cx_eval_lab.containment_study --output ci-evidence/containment.json
      - name: Exercise cross-run cache isolation and permitted sharing
        run: uv run python -m cx_eval_lab.isolation_study --output ci-evidence/isolation.json
      - name: Exercise reviewed incident promotion and regression reruns
        run: uv run python -m cx_eval_lab.incident_regression --output ci-evidence/incident-regression.json
      - name: Derive paired slice changes from replayed legacy executions
        run: uv run python -m cx_eval_lab.paired_slices --output ci-evidence/paired-slices.json
      - name: Replay native slice diagnostics with explicit synthetic fixture anchors
        run: >-
          uv run python -m cx_eval_lab.resolution_slice_study
          --source docs/assets/native-resolution-semantic-v1.json
          --expected-source-sha256 sha256:638237b1615ec159c87d8ec8f2bb748867c2b319c93ff678470f4e0619419839
          --trusted-calibration-hash sha256:454a18e2f18782f37ecfb2c7832a259aead13455be9cacfe94a7464e0d54730b
          --output ci-evidence/resolution-slices.json
      - name: Build book with strict validation
        run: uv run mkdocs build --strict
      - name: Execute bounded multi-evidence context packing and action controls
        run: uv run python -m cx_eval_lab.context_packing --output ci-evidence/context-packing.json
      - name: Enumerate finite-population sampling and uncertainty controls
        run: uv run python -m cx_eval_lab.sampling_study --output ci-evidence/sampling-study.json
      - name: Recompute annotation agreement and reviewer-assignment controls
        run: uv run python -m cx_eval_lab.rater_study --output ci-evidence/rater-study.json
      - name: Execute matched judge-sensitivity and shared-error controls
        run: uv run python -m cx_eval_lab.judge_sensitivity --output ci-evidence/judge-sensitivity.json
      - name: Reconstruct mixed-trace error-analysis teaching views
        run: >-
          uv run python -m cx_eval_lab.error_analysis_workshop
          --source docs/assets/native-resolution-semantic-v1.json
          --expected-source-sha256 sha256:638237b1615ec159c87d8ec8f2bb748867c2b319c93ff678470f4e0619419839
          --trusted-calibration-hash sha256:454a18e2f18782f37ecfb2c7832a259aead13455be9cacfe94a7464e0d54730b
          --output ci-evidence/error-analysis-workshop.json
      - name: Retain available evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
