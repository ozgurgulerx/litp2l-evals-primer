site_name: Evals Primer
site_description: A practical field guide to evaluating AI systems
site_author: Ozgur Guler
site_url: https://ozgurguler.org/litp2l-evals-primer/
repo_url: https://github.com/ozgurgulerx/litp2l-evals-primer
repo_name: ozgurgulerx/litp2l-evals-primer
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  icon:
    logo: material/chart-box-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - toc.integrate

nav:
  - Start Here: index.md
  - Part I · Evaluation foundations:
      - 1. Foundations: foundations.md
      - 2. Dataset Design: dataset-design.md
      - 3. Metrics: metrics.md
      - 4. Human Evaluation: human-evaluation.md
      - 5. LLM as a Judge: llm-as-a-judge.md
      - 6. Robustness, Safety & Fairness: robustness-safety.md
      - 7. RAG & Research Evals: rag-research-evals.md
      - 8. Agent & System Evals: agent-evals.md
      - 9. Benchmark Reproducibility: benchmark-reproducibility.md
      - 10. Production Evals: production-evals.md
      - 11. Release Gates & Shipping: checklist.md
  - Part II · Build the CX evaluation system:
      - The CX Eval Lab: build-the-system.md
      - Evidence Spine: evidence-spine.md
      - Micro-katas: micro-katas.md
      - Primer Delivery Map: primer-delivery-map.md
  - Part III · Reference library:
      - References: references.md
      - Courses & Learning Paths: courses.md
      - Interview & Design Drills: interview-drills.md
      - Source Coverage Ledger: source-coverage.md
  - Part IV · Comparative system studies:
      - System Studies: system-studies.md
      - Statistical Method Study: statistical-method-study.md
      - Research-to-Practice Evidence: research-to-practice.md
      - Long-Running & Serving Failures: long-running-serving.md
      - Modern Agent Architectures: modern-agent-architectures.md
      - Eval Operations & Integrity: eval-operations-integrity.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 Ozgur Guler
